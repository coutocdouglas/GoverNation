<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>GoverNation · Protótipo do Novo mandato (v6)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:'Corigo';src:url('../../src/assets/fonts/Corigo.otf');font-weight:400}
@font-face{font-family:'ZT Nature';src:url('../../src/assets/fonts/ZTNature-Regular.woff2');font-weight:400}
@font-face{font-family:'ZT Nature';src:url('../../src/assets/fonts/ZTNature-Medium.woff2');font-weight:500 600}
@font-face{font-family:'ZT Nature';src:url('../../src/assets/fonts/ZTNature-Bold.woff2');font-weight:700 900}
/* tokens idênticos aos do jogo (src/ui/painel.css, .pn) */
:root{--bg:#0a0a09;--panel:#141413;--panel2:#1c1c1a;--line:#2b2b28;--text:#ecebe6;--muted:#a09f98;--gold:#f5c542;--green:#2ecc71;--red:#ff5a5f;--accent:#9aa7e6;--well:#0f0f0e;--trk:#2a2a27;--glass:rgba(20,20,19,.78);--glass-line:rgba(255,255,255,.16);--shadow:0 1px 2px rgba(0,0,0,.5),0 14px 34px -14px rgba(0,0,0,.7);--pc:#c9a227;--font:'ZT Nature','Segoe UI',system-ui,sans-serif;--display:'Corigo','ZT Nature','Segoe UI',sans-serif;--photo:grayscale(.2)}
:root.claro{--bg:#f3f0ea;--panel:#ffffff;--panel2:#f7f4ee;--line:#e4dfd5;--text:#17171a;--muted:#5a564e;--gold:#84600c;--green:#1f6f45;--red:#a93a28;--accent:#5565bd;--well:#f0ece4;--trk:#e6e1d6;--glass:rgba(255,255,255,.8);--glass-line:rgba(23,23,26,.22);--shadow:0 1px 2px rgba(30,25,15,.05),0 12px 32px -14px rgba(30,25,15,.2);--photo:grayscale(1) contrast(1.05)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.35 var(--font);display:grid;grid-template-rows:auto 1fr auto;height:100vh;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;text-align:left}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-weight:500;letter-spacing:-.01em}
small,.muted{color:var(--muted)}
.up{color:var(--green)}.down{color:var(--red)}
/* topo no estilo do jogo */
.top{display:flex;align-items:center;gap:26px;padding:12px 28px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 92%,transparent)}
.logo{font-family:var(--display);font-size:26px;line-height:1}
.logo small{display:block;font:11.5px var(--font);letter-spacing:.04em;text-transform:uppercase;margin-top:3px}
.top h1{font-family:var(--display);font-size:34px;font-weight:400}
.steps{display:flex;gap:8px;list-style:none;margin:0;padding:0}
.steps button{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:7px 16px;text-align:center;font-weight:600;font-size:13px}
.steps .on button{background:var(--text);color:var(--bg);border-color:var(--text)}
.steps .done button{color:var(--text)}
.sp{flex:1}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--muted)}
.body{display:grid;grid-template-columns:1fr 430px;gap:20px;padding:16px 28px;min-height:0}
.main{min-height:0;min-width:0;display:grid;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px 18px;min-height:0;box-shadow:var(--shadow)}
.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;font-weight:600}
.btn{background:transparent;border:1px solid var(--line);border-radius:10px;padding:9px 16px;text-align:center;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn--primary{background:var(--green);color:#04120a;border:0;font-weight:700}
:root.claro .btn--primary{color:#fff}
.btn--primary:hover{filter:brightness(1.1)}
/* molduras redondas */
.ring{border-radius:50%;overflow:hidden;background:var(--well);border:2px solid var(--c,var(--pc));flex:none;display:grid;place-items:center}
.ring img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block;filter:var(--photo)}
.ring.logo-r img{object-fit:contain;padding:14%;filter:none}
/* passo 1 */
.s1{grid-template-columns:330px 1fr;grid-template-rows:minmax(0,1fr)}
.face{display:flex;flex-direction:column;gap:10px;align-items:center}
.bigring{position:relative;width:230px;height:230px;border-radius:50%;padding:6px;background:conic-gradient(from 200deg,var(--pc),color-mix(in srgb,var(--pc) 25%,#000),var(--pc));box-shadow:0 0 0 1px #000,0 12px 40px -12px var(--pc)}
.bigring::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:1px solid color-mix(in srgb,var(--pc) 50%,transparent)}
.bigring img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 18%;display:block;filter:var(--photo);background:var(--well)}
.plate{margin-top:-4px;text-align:center;background:var(--panel2);border:1px solid var(--pc);border-radius:999px;padding:5px 18px;font-weight:700;font-size:.9rem;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filters{display:flex;gap:6px;margin-top:6px}
.filters .btn{padding:5px 11px;font-size:.8rem}
.gal{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;width:100%;overflow:auto;padding:5px;flex:1;min-height:0;align-content:start}
.gal button{border:2px solid transparent;border-radius:50%;padding:0;background:none;overflow:hidden;aspect-ratio:1}
.gal button img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block;border-radius:50%;filter:var(--photo) brightness(.8)}
.gal button:hover img,.gal button.on img{filter:var(--photo)}
.gal button.on{border-color:var(--pc);box-shadow:0 0 12px -2px var(--pc)}
.mid{display:grid;grid-template-rows:auto 1fr;gap:14px;min-height:0}
.row2{display:grid;grid-template-columns:1fr 1.5fr;gap:14px}
input{width:100%;background:var(--well);border:1px solid var(--line);border-radius:10px;padding:10px 13px;color:var(--text);font:inherit;font-size:1.05rem}
input:focus{outline:none;border-color:var(--accent)}
.diffs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.diff{background:var(--well);border:1px solid var(--line);border-radius:12px;padding:8px 11px}
.diff.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 9%,var(--well))}
.diff b{display:block}.diff small{font-size:.72rem;line-height:1.2;display:block}
.spec{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;min-height:0;flex:1}
.col{display:flex;flex-direction:column;gap:9px;min-height:0}
.colh{font-weight:700;letter-spacing:.08em;font-size:.76rem;padding-bottom:5px;border-bottom:2px solid}
.colh.e{color:#ff6a58}.colh.c{color:var(--gold)}.colh.d{color:#6f9cff}
.party{position:relative;display:grid;grid-template-columns:58px 1fr;gap:3px 12px;background:var(--well);border:1px solid var(--line);border-radius:14px;padding:10px 12px;flex:1;align-content:center}
.party:hover{border-color:var(--c)}
.party.on{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 8px 24px -12px var(--c);background:color-mix(in srgb,var(--c) 10%,var(--well))}
.party .ring{width:58px;height:58px;grid-row:span 3;align-self:center}
.party b{font-size:1rem}.party b small{margin-left:6px;font-weight:400;font-size:.74rem}
.party .tg{font-size:.74rem;color:var(--muted);line-height:1.25}
.party .ok-mark{position:absolute;top:8px;right:10px;font-size:.7rem;color:var(--green);font-weight:700}
.chips{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tag{font-size:.62rem;border:1px solid var(--line);border-radius:999px;padding:1px 7px;color:var(--muted);font-weight:600}
.tag.warn{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 40%,var(--line))}
.tag.ok{color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,var(--line))}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;font-size:.66rem;color:var(--muted)}
.meters i{display:block;height:4px;border-radius:3px;background:var(--trk);position:relative;margin-top:2px}
.meters i u{position:absolute;top:-2px;width:3px;height:8px;background:var(--pc);border-radius:2px}
.hint{font-size:.76rem;color:var(--muted)}
/* janela de vidro do partido (igual às janelas do jogo) */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:50;animation:fin .15s}
@keyframes fin{from{opacity:0}}
.win{width:min(880px,calc(100% - 80px));max-height:calc(100% - 80px);display:flex;flex-direction:column;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.1);backdrop-filter:blur(22px) saturate(1.1);border:1px solid var(--glass-line);box-shadow:0 24px 70px -24px rgba(0,0,0,.6)}
.win>header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--glass-line)}
.win>header h3{flex:1;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.win>header button{border:1px solid var(--glass-line);background:transparent;width:28px;height:28px;text-align:center}
.wbody{padding:20px 22px;overflow:auto;display:grid;grid-template-columns:200px 1fr;gap:6px 24px}
.wl{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.wl .ring{width:150px;height:150px;border-width:3px}
.wl h2{font-family:var(--display);font-size:26px;font-weight:400;line-height:1.1}
.wr{display:flex;flex-direction:column;gap:12px;font-size:.88rem}
.wr h5{margin:0 0 3px;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.wr p,.wr li{color:var(--text);opacity:.88;line-height:1.4}
.wr ul{margin:0;padding-left:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rel{display:flex;gap:12px;flex-wrap:wrap}
.rel span{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;font-weight:700}
.rel .ring{width:46px;height:46px;border-width:2px}
.rel.foe .ring{border-color:var(--red)}.rel.fr .ring{border-color:var(--green)}
.vant{background:color-mix(in srgb,var(--gold) 9%,transparent);border:1px solid color-mix(in srgb,var(--gold) 40%,var(--line));padding:9px 12px;font-size:.84rem}
.vant b{color:var(--gold)}
.win>footer{display:flex;gap:10px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--glass-line)}
/* painel */
.aside{display:flex;flex-direction:column;gap:7px;min-height:0;overflow:hidden}
.aside h3{font-size:.98rem;display:flex;justify-content:space-between;align-items:baseline}
.aside h3 b{font-family:var(--display);font-size:1.7rem;font-weight:400;color:var(--text)}
.blocks{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;align-content:start}
.blk h4{margin:0 0 2px;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.g{display:grid;grid-template-columns:1fr auto;gap:0 6px;font-size:.68rem;line-height:1.1;margin-bottom:2px}
.g span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g span:nth-child(2){text-align:right;font-weight:600}
.g small{font-size:.6rem;margin-left:3px}
.g .bar{grid-column:1/-1;height:3px;background:var(--trk);border-radius:2px;margin-top:1px}
.g .bar i{display:block;height:100%;border-radius:2px}
.why{font-size:.68rem;color:var(--muted);border-top:1px solid var(--line);padding-top:6px;line-height:1.3}
.rival{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:7px;font-size:.74rem;margin-top:auto}
.rival .ring{width:40px;height:40px;border-color:#2d5ad0}
/* passo 2 */
.s2{grid-template-columns:1fr 1fr}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.cats button{font-size:.72rem;border:1px solid var(--line);background:none;border-radius:999px;padding:3px 11px;color:var(--muted);font-weight:600}
.cats button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;overflow:auto;max-height:calc(100% - 62px);padding:2px}
.opt{background:var(--well);border:1px solid var(--line);border-radius:14px;padding:9px 11px;display:flex;flex-direction:column;gap:3px;min-height:0}
.opt b{font-size:.86rem}.opt p{font-size:.7rem;color:var(--muted);line-height:1.25}
.opt.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 9%,var(--well))}
.opt:disabled{opacity:.4;cursor:not-allowed}
.fx{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:.68rem}
.cat-tag{font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between}
/* passo 3 */
.s3{grid-template-rows:repeat(3,auto);align-content:start;gap:10px}
.lane{display:grid;grid-template-columns:30px repeat(4,1fr);gap:10px;align-items:start}
.lane>.lh{writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;font-weight:700;letter-spacing:.14em;font-size:.72rem;border-left:2px solid;padding:0 6px;align-self:stretch}
.lh.e{color:#ff6a58}.lh.c{color:var(--gold)}.lh.d{color:#6f9cff}
.pv{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:16px;padding:9px;box-shadow:var(--shadow)}
.pvh{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:.8rem}
.pvh .ring{width:26px;height:26px;border-width:1px}
.vice{width:100%;display:grid;grid-template-columns:44px 1fr;gap:1px 9px;background:var(--well);border:1px solid var(--line);border-radius:12px;padding:5px 8px;margin-bottom:5px}
.vice .ring{width:44px;height:44px;grid-row:span 3;align-self:center}
.vice b{font-size:.78rem;display:flex;justify-content:space-between;gap:4px}
.vice small{font-size:.64rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vice .bn{font-size:.66rem;color:var(--green)}
.vice.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 9%,var(--well))}
.vice:disabled{opacity:.4}
.ch{font-weight:600;font-size:.66rem;border-radius:999px;padding:0 6px;border:1px solid}
.ch.hi{color:var(--green)}.ch.mid{color:var(--gold)}.ch.lo{color:var(--red)}
.slots{display:flex;flex-direction:column;gap:5px}
.sl{border:1px dashed var(--line);border-radius:12px;padding:6px 10px;font-size:.76rem;min-height:36px;display:flex;align-items:center;gap:8px}
.sl.f{border-style:solid;border-color:var(--gold);background:color-mix(in srgb,var(--gold) 7%,transparent)}
.sl.lk{border-style:solid;border-color:var(--red);background:color-mix(in srgb,var(--red) 8%,transparent)}
.sl .ring{width:34px;height:34px;border-width:1px}
/* passo 4 */
.s4{grid-template-rows:auto 1fr}
.press{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;background:color-mix(in srgb,var(--red) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--red) 45%,var(--line));border-radius:20px;padding:12px 18px}
.press .ic{font-size:1.8rem}
.press h3{color:var(--red);font-size:.98rem;margin-bottom:2px}
.lock{border:1px solid color-mix(in srgb,var(--red) 45%,var(--line));border-radius:14px;padding:7px 12px;background:var(--well);min-width:260px}
.lock small{display:block;color:var(--red);font-size:.62rem;text-transform:uppercase;letter-spacing:.08em}
.pro{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;overflow:auto;max-height:calc(100% - 96px);padding:2px;align-content:start}
.pro .opt{min-height:116px}
.st{color:var(--gold);letter-spacing:1px}
.meta{font-size:.64rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:3px;margin-top:auto}
.side{font-size:.64rem;color:var(--muted)}.side.mine{color:var(--gold)}
.mix{display:flex;gap:14px;font-size:.76rem;margin-bottom:8px;color:var(--muted)}
.mix b{color:var(--text)}
.foot{display:flex;gap:12px;align-items:center;padding:11px 28px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg) 92%,transparent)}
.foot .warn{color:var(--gold);font-size:.82rem}
.foot .btn{padding:11px 26px;font-size:1rem}
/* ===== v4 ===== */
.spec{flex:none}
.col{gap:8px;flex:none}
.party{flex:none;grid-template-columns:46px 1fr;padding:8px 10px;gap:0 10px;align-content:center}
.party .ring{width:46px;height:46px;grid-row:span 2}
.party b{display:flex;align-items:center;gap:6px;font-size:.95rem}
.party b .ok-mark{position:static;margin-left:auto}
.party .tg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hemi{display:flex;height:34px;border-radius:10px;overflow:hidden;position:relative;border:1px solid var(--line)}
.hemi i{display:grid;place-items:center;font-style:normal;font-size:.7rem;font-weight:700;color:#fff;min-width:0;overflow:hidden;position:relative}
.hemi i span{text-shadow:0 1px 2px rgba(0,0,0,.6)}
.hemi .maj{position:absolute;left:50.1%;top:-3px;bottom:-3px;width:2px;background:var(--text)}
.hemi.small{height:16px}
/* vices em linhas */
.s3{display:flex;flex-direction:column;gap:6px;overflow:hidden}
.vhead{font-weight:700;letter-spacing:.14em;font-size:.7rem;padding:2px 0;border-bottom:2px solid;margin-top:2px}
.vhead.e{color:#ff6a58}.vhead.c{color:var(--gold)}.vhead.d{color:#6f9cff}
.vrow{display:grid;grid-template-columns:200px repeat(3,1fr);gap:8px;align-items:stretch}
.vlab{display:flex;align-items:center;gap:10px;background:var(--well);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:14px;padding:6px 10px;font-size:.82rem}
.vlab .ring{width:40px;height:40px}
.vice{margin:0;grid-template-columns:50px 1fr;padding:6px 9px;gap:0 10px}
.vice .ring{width:50px;height:50px;grid-row:span 3}
.vice small{font-size:.66rem}
/* ministérios */
.s5{grid-template-columns:230px 1fr;grid-template-rows:minmax(0,1fr) auto;gap:12px}
.plist{grid-row:span 1;overflow:hidden;display:flex;flex-direction:column;gap:3px}
.pas{display:flex;align-items:center;gap:9px;background:var(--well);border:1px solid var(--line);border-radius:12px;padding:3px 8px;font-size:.78rem}
.pas small{font-size:.66rem;color:var(--muted)}
.pas.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 9%,var(--well))}
.pas .ring,.pas .ico{width:34px;height:34px;display:grid;place-items:center;font-size:1.1rem;flex:none}
.pas .ico{background:var(--panel2);border-radius:50%}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:10px;height:calc(100% - 28px)}
.min{display:flex;flex-direction:column;gap:6px;background:var(--well);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:14px;padding:10px 12px;min-height:0}
.min:hover{border-color:var(--c)}
.min.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 9%,var(--well));box-shadow:0 0 0 1px var(--gold)}
.mh{display:flex;gap:10px;align-items:center}
.mh .ring{width:56px;height:56px;flex:none}
.mh b{font-size:.92rem}.mh small{font-size:.66rem;color:var(--muted);display:block;line-height:1.2}
.ring.mini{width:16px;height:16px;border-width:1px}
.mhist{font-size:.7rem;color:var(--muted);line-height:1.3}
.axes{display:grid;gap:3px}
.ax{display:grid;grid-template-columns:62px 1fr 62px;gap:6px;align-items:center;font-size:.58rem;color:var(--muted)}
.ax span:last-child{text-align:right}
.ax i{height:4px;border-radius:3px;background:var(--trk);position:relative}
.ax i::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line)}
.ax u{position:absolute;top:-2px;width:8px;height:8px;border-radius:50%;background:var(--c);margin-left:-4px}
.ad{display:flex;flex-direction:column;gap:2px;font-size:.66rem;margin-top:auto;line-height:1.2}
.pedstrip{grid-column:1/-1}
.pedrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ped{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;background:var(--well);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:7px 10px;font-size:.76rem}
.ped .ring{width:40px;height:40px}
.ped.sim{border-color:var(--green)}.ped.nao{border-color:var(--red)}
.pbt{display:flex;flex-direction:column;gap:4px}
.pbt .btn{padding:3px 12px;font-size:.74rem}

function seatsOf(diff){
  const mean=513/9,k=DIFF[diff].k;
  let v=PARTIES.map(p=>Math.max(10,mean+(p.seats-mean)*k));
  const f=513/v.reduce((a,b)=>a+b,0);v=v.map(x=>Math.round(x*f));
  const out={};PARTIES.forEach((p,i)=>out[p.id]=v[i]);return out;
}

const hs=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
const rngOf=seed=>{let a=hs(String(seed))||1;const f=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};for(let i=0;i<6;i++)f();return f};

function viceInfo(party,vp,lealdade){
  const a=PBY[party],b=PBY[vp];
  const dist=Math.abs(a.econ-b.econ)/2+Math.abs(a.cost-b.cost)/2;
  let chance=vp===party?92:Math.max(15,Math.round(88-dist*0.75));
  if(lealdade==='oscilante')chance-=5;if(lealdade==='leal')chance+=3;
  chance=Math.max(10,Math.min(95,chance));
  const bonus=Math.round((100-chance)/22*10)/10;
  return{chance,bonus};
}

/* soma de TUDO que mexe no gráfico, com a origem de cada parcela */
function parcels(){
  const p=PBY[st.party],seats=seatsOf(st.diff)[st.party];
  const parts={dif:{},part:{},perfil:{},prom:{},min:{}};
  cabinet().forEach(m=>{PASTAS.find(x=>x[0]===m.area)[4].forEach(gid=>{const g=G.find(x=>x[0]===gid);parts.min[gid]=(parts.min[gid]||0)+3*(g[5]*m.eco/100+g[6]*m.cost/100)})});
  G.forEach(g=>{parts.dif[g[0]]=DIFF[st.diff].mood});
  const pf=partyFx(p,seats);parts.part=pf.o;
  [...st.traits.map(i=>T.find(t=>t[0]===i)),...st.habits.map(i=>H.find(t=>t[0]===i))].forEach(t=>{for(const g in t[4])parts.perfil[g]=(parts.perfil[g]||0)+t[4][g]});
  const ids=st.diff==='facil'?st.promises:[PRESS[st.party][3],...st.promises];
  ids.forEach(id=>{const x=PR.find(a=>a[0]===id);if(x&&(x[4]===p.w||x[4]==='qualquer'&&false))parts.prom[x[6]]=(parts.prom[x[6]]||0)+1.5});
  scenario().sup.forEach(s=>{if(st.bandeiras[s.pid]==='sim'){const gid=PBY[s.pid].base[0];parts.prom[gid]=(parts.prom[gid]||0)+1.5}});
  return {parts,sb:pf.sb,seats};
}
function chartRows(){
  const {parts}=parcels();
  return G.map(g=>{const ex=['dif','part','perfil','prom','min'].reduce((a,k)=>a+(parts[k][g[0]]||0),0);
    return{g,ex,after:Math.max(0,Math.min(100,g[3]+ex))}});
}
function chartHTML(){
  const rows=chartRows();let tot=0,w=0;rows.forEach(r=>{tot+=r.after*r.g[4];w+=r.g[4]});
  const apr=Math.round(tot/w);
  const blocks=BLOCKS.map(([id,nm])=>`<div class="blk" style="${id==='trabalho'?'grid-row:span 2':''}"><h4>${nm}</h4>${rows.filter(r=>r.g[2]===id).map(r=>`<div class="g"><span>${r.g[1]}</span><span class="${r.ex>=.5?'up':r.ex<=-.5?'down':''}">${Math.round(r.after)}${Math.abs(r.ex)>=.5?`<small>${sgn(r.ex)}</small>`:''}</span><div class="bar"><i style="width:${r.after}%;background:${r.ex>=.5?'var(--green)':r.ex<=-.5?'var(--red)':'var(--gold)'}"></i></div></div>`).join('')}</div>`).join('');
  const best=[...rows].sort((a,b)=>b.ex-a.ex),pos=best.slice(0,2).map(r=>r.g[1]),neg=best.slice(-2).map(r=>r.g[1]);
  return {html:`<h3>Como o país te recebe <span>aprovação <b>${apr}%</b></span></h3><div class="blocks">${blocks}</div>`,
    why:`<div class="why">Mais favorável: <span class="up">${pos.join(', ')}</span>. Mais frio: <span class="down">${neg.join(', ')}</span>. O gráfico soma dificuldade (${sgn(DIFF[st.diff].mood)}), alinhamento do partido, perfil e promessas do seu lado.</div>`};
}
function asideCard(top,withRival,noWhy){
  const c=chartHTML(),rv=RIVALS[side()];
  return `<aside class="card aside">${top||''}${c.html}${noWhy?'':c.why}${withRival?`<div class="rival"><span class="ring"><img src="${IMG(rv[2])}"></span><div><small>Seu rival</small><br><b>${rv[0]}</b><br><small>${rv[1]}</small></div></div>`:''}</aside>`;
}

  const dem=[{pid:st.party,min:sc.own,own:true},...sc.sup.map(s=>({...s}))];
  dem.forEach(d=>{d.given=given[d.pid]||0;const m=d.pasta&&st.cabinet[d.pasta]&&minById(st.cabinet[d.pasta]);d.gotPasta=!!(m&&m.party===d.pid);d.ok=d.given>=d.min&&(!d.hard||d.gotPasta)});
  const THR={facil:95,normal:72,dificil:48}[st.diff],FAT={facil:.85,normal:.72,dificil:.5}[st.diff];
  const pen=sel.filter(m=>m.party!==st.party).reduce((a,m)=>a+Math.max(0,dist(m)-30)/8,0);
  const fid=clamp(Math.round(80+ownN*3-pen-Math.max(0,sc.own-ownN)*8),20,98);
  const aE=sel.length?my.econ+(mean(sel.map(m=>m.eco))-my.econ)*.3:my.econ,aC=sel.length?my.cost+(mean(sel.map(m=>m.cost))-my.cost)*.3:my.cost;
  let baseSeats=seats[st.party]*fid/100*(fid<60?.85:1);const base=[],opp=[],entry={};
  dem.filter(d=>!d.own).forEach(d=>{const f=Math.min(1,d.given/d.min)*(d.hard&&!d.gotPasta?.5:1);if(f>0){baseSeats+=seats[d.pid]*f;base.push(d.pid)}});
  /* quem não apoiou: a distância ideológica decide quantas pastas pede; campo oposto não entra */
  PARTIES.filter(q=>q.id!==st.party&&!dem.some(d=>d.pid===q.id)).forEach(q=>{
    const dd=(Math.abs(q.econ-my.econ)+Math.abs(q.cost-my.cost))/2;
    let need=dd<THR*.6?1:dd<THR?2:null;if(need&&seats[q.id]>=70)need=Math.min(3,need+1);
    entry[q.id]={need,dist:Math.round(dd),given:given[q.id]||0};
    if(need&&(given[q.id]||0)>=need){baseSeats+=seats[q.id]*FAT;base.push(q.id)}
    else if(need===null)opp.push(q.id)});
  const custo=base.filter(p=>!dem.some(d=>d.pid===p)).reduce((a,p)=>a+Math.ceil(seats[p]/20),0);
  return{sel,fid,aE,aC,base,opp,entry,custo,baseSeats:Math.round(baseSeats),ownN,mine:seats[st.party],dem};
}
function axisHTML(k,v){const a=AX[k];return `<div class="ax"><span>${a[0]}</span><i><u style="left:${(v+100)/2}%"></u></i><span>${a[1]}</span></div>`}
function minCard(m,sel){
  const p=PBY[m.party],tag=m.tipo==='meu'?['seu partido','ok']:m.tipo==='aliado'?['aliado','ok']:['independente','warn'];
  return `<button class="min ${sel?'on':''}" style="--c:${p.c}" onclick="st.cabinet['${m.area}']='${m.id}';render()">
    <div class="mh"><span class="ring"><img src="${IMG(m.portrait)}"></span><div><b>${m.name}</b><div class="chips"><span class="ring logo-r mini" style="--c:${p.c}">${logoImg(m.party)}</span><span class="tag">${p.s}</span><span class="tag ${tag[1]}">${tag[0]}</span></div><small>${m.align}</small></div></div>
    <p class="mhist">${m.hist}</p>
    <div class="axes">${AXK.map(k=>axisHTML(k,m.bars[k])).join('')}</div>
    <div class="ad"><span class="up">▲ ${m.adv}</span><span class="down">▼ ${m.dis}</span></div></button>`;
}
function autoCabinet(){
  const sc=scenario(),ms=MINC.list,cab={},need={};
  const dem=[...sc.sup.map(s=>({pid:s.pid,min:s.min,pasta:s.pasta})),{pid:st.party,min:sc.own}];
  dem.forEach(d=>need[d.pid]=d.min);
  const my=PBY[st.party],dist=m=>(Math.abs(m.eco-my.econ)+Math.abs(m.cost-my.cost))/2;
  dem.forEach(d=>{if(d.pasta&&!cab[d.pasta]){const m=ms.find(x=>x.area===d.pasta&&x.party===d.pid);if(m){cab[d.pasta]=m.id;need[d.pid]--}}});
  let guard=40;
  while(guard--){
    const d=dem.filter(x=>need[x.pid]>0).sort((a,b)=>need[b.pid]-need[a.pid])[0];if(!d)break;
    let best=null;PASTAS.filter(p=>!cab[p[0]]).forEach(p=>{const m=ms.find(x=>x.area===p[0]&&x.party===d.pid);if(m&&(!best||dist(m)<dist(best)))best=m});
    if(!best)break;cab[best.area]=best.id;need[d.pid]--;
  }
  /* o que sobrou: recruta partidos de fora enquanto a base não chega perto da maioria (pacotes de pastas), o resto fica com seu partido */
  const free=()=>PASTAS.filter(p=>!cab[p[0]]);
  const trial=extra=>{st.cabinet={...cab,...extra};return cabStats()};
  for(let g=0;g<6;g++){
    st.cabinet={...cab};const cs=cabStats();if(cs.baseSeats>=265)break;
    let best=null;
    Object.entries(cs.entry).forEach(([pid,e])=>{if(!e.need||e.given>=e.need||free().length<e.need)return;
      const pick=free().map(p=>({p,m:ms.find(x=>x.area===p[0]&&x.party===pid)})).filter(x=>x.m).sort((a,b)=>dist(a.m)-dist(b.m)).slice(0,e.need);
      if(pick.length<e.need)return;
      const ex={};pick.forEach(x=>ex[x.p[0]]=x.m.id);const t=trial(ex);const gain=(t.baseSeats-cs.baseSeats)/e.need;
      if(!best||gain>best.gain)best={gain,ex,tot:t.baseSeats-cs.baseSeats}});
    if(!best||best.tot<=0)break;Object.assign(cab,best.ex);
  }
  PASTAS.filter(p=>!cab[p[0]]).forEach(p=>{cab[p[0]]=ms.find(x=>x.area===p[0]&&x.tipo==='meu').id});
  st.cabinet=cab;
}
function demCard(d){
  const q=PBY[d.pid],pn=d.pasta&&PASTAS.find(p=>p[0]===d.pasta)[1];
  const dots=Array.from({length:Math.max(d.min,d.given)},(_,i)=>`<i class="${i<d.given?'f':''}"></i>`).join('');
  const lab=d.ok?'Atendido':d.given<d.min?'Falta '+(d.min-d.given):'Falta a pasta';
  return `<div class="dem ${d.ok?'ok':'bad'}" style="--c:${q.c}"><span class="ring logo-r">${logoImg(d.pid)}</span><div class="dd"><b>${q.s}</b> <small>${d.own?'seu partido exige':'apoiou você'}</small><div class="dots">${dots}<span>${d.given}/${d.min} pastas</span></div>${pn?`<small class="${d.gotPasta?'up':d.hard?'down':''}">${d.hard?'exige':'quer'} ${pn}${d.gotPasta?' ✓':''}</small>`:''}</div><span class="tag ${d.ok?'ok':'warn'}">${lab}</span></div>`;
}
function step5(){
  genMinisters();
  const sc=scenario(),cs=cabStats();
  const pasta=PASTAS.find(x=>x[0]===st.pasta),cands=MINC.list.filter(m=>m.area===st.pasta);
  const list=`<div class="card plist"><div class="lbl"><span>Pastas</span><span>${Object.keys(st.cabinet).length}/13</span></div>${PASTAS.map(x=>{const m=st.cabinet[x[0]]&&minById(st.cabinet[x[0]]);const cv=sc.sup.find(s=>s.pasta===x[0]);return `<button class="pas ${st.pasta===x[0]?'on':''}" onclick="st.pasta='${x[0]}';render()">${m?`<span class="ring" style="--c:${PBY[m.party].c}"><img src="${IMG(m.portrait)}"></span>`:`<span class="ico">${x[2]}</span>`}<span><b>${x[1]}</b>${cv?` <small class="cv" title="${PBY[cv.pid].s} ${cv.hard?'exige':'quer'} esta pasta">★ ${PBY[cv.pid].s}</small>`:''}<br><small>${m?m.name+' · '+PBY[m.party].s:'sem ministro'}</small></span></button>`}).join('')}</div>`;
  const cc=`<div class="card"><div class="lbl"><span>${pasta[2]} ${pasta[3]} · escolha 1 de 6</span><span>1 do seu partido · 1 aliado · 4 variados</span></div><div class="mgrid">${cands.map(m=>minCard(m,st.cabinet[st.pasta]===m.id)).join('')}</div></div>`;
  const strip=`<div class="card pedstrip cen"><div class="cenh"><div class="lbl" style="margin-bottom:4px"><span>Cenário pós-eleição</span></div><h3>${sc.nome}</h3><p class="hint">${sc.hist}</p></div><div class="demgrid">${cs.dem.map(demCard).join('')}</div><div class="cenb"><button class="btn btn--primary" onclick="autoCabinet();render()">⚙ Distribuir automaticamente</button><button class="btn" onclick="st.cabinet={};render()">Limpar tudo</button><small>O automático cumpre os pedidos primeiro e recruta partidos de fora até chegar perto da maioria. Depois você ajusta à mão.</small></div></div>`;
  return `<div class="main s5" style="display:grid">${list}${cc}${strip}</div>`;
}
function step5top(){
  const cs=cabStats(),my=PBY[st.party],falta=Math.max(0,257-cs.baseSeats);
  return `<h3>Sua bancada no Congresso <span>${cs.fid}% fiéis</span></h3>
   <div class="hemi small"><i style="flex:${cs.baseSeats};background:var(--green)"></i><i style="flex:${Math.max(1,513-cs.baseSeats)};background:var(--trk)"></i><b class="maj"></b></div>
   <div class="hint"><b>${cs.baseSeats}</b> deputados na base · ${falta?`<b class="down">faltam ${falta} para a maioria (257)</b>`:'<b class="up">maioria garantida (257)</b>'}</div>
   <div class="hint">${cs.base.length?`Na base: ${cs.base.map(p=>PBY[p].s).join(', ')}`:'Nenhum partido de fora na base'}.${cs.custo?` Custo da maioria: <b>${cs.custo} cargos de 2º escalão</b> por mês.`:''}</div>
   <div class="hint">${cs.opp.length?`<span class="down">Fora do alcance (campo oposto):</span> ${cs.opp.map(p=>PBY[p].s).join(', ')}. `:''}Partido de fora pede 1 a 3 pastas conforme a distância e o tamanho; apoiador sem pasta suficiente sai da base.</div>
   <div class="meters" style="gap:4px 12px"><div>Economia da bancada ${Math.round(cs.aE)} (partido: ${my.econ})<i><u style="left:${(cs.aE+100)/2}%"></u></i></div><div>Costumes da bancada ${Math.round(cs.aC)} (partido: ${my.cost})<i><u style="left:${(cs.aC+100)/2}%"></u></i></div></div>`;
}

function pick(k,id,max){const a=st[k];st[k]=a.includes(id)?a.filter(x=>x!==id):a.length<max?[...a,id]:a;render()}

function render(){
  document.documentElement.style.setProperty('--pc',col());
  $('#steps').innerHTML=['Candidato','Perfil','Vice','Promessas','Ministérios'].map((n,i)=>`<li class="${st.step===i+1?'on':st.step>i+1?'done':''}"><button onclick="st.step=${i+1};render()">${i+1}. ${n}</button></li>`).join('');
  const main=[step1,step2,step3,step4,step5][st.step-1]();
  const aside=asideCard(st.step===3?step3top():st.step===4?step4top():st.step===5?step5top():'',st.step<=2,st.step===5);
  $('#body').innerHTML=main+aside+modalHTML();
  const last=st.step===5;
  let warn='Começar um novo mandato apaga o mandato salvo.';
  if(last){const cs=cabStats(),bad=cs.dem.filter(d=>!d.ok),faltam=13-cs.sel.length;
    warn=bad.length?`⚠ Compromissos em aberto: ${bad.map(d=>PBY[d.pid].s).join(', ')}. Quem não for atendido sai da base e a relação cai.`:faltam?`Faltam ${faltam} pastas para fechar o ministério.`:'✓ Todos os compromissos atendidos.'}
  $('#foot').innerHTML=`<span class="warn">${warn}</span><span class="sp"></span>
   <button class="btn" onclick="st.step=Math.max(1,st.step-1);render()">Voltar</button>
   <button class="btn btn--primary" onclick="${last?'':'st.step=Math.min(5,st.step+1);render()'}">${last?'Tomar posse · 1º de janeiro de 2027':'Continuar'}</button>`;
}
/* escala adaptativa: o desenho de 1920x1080 se ajusta a qualquer resolução e proporção */
function fit(){const s=Math.max(.5,Math.min(2,Math.min(innerWidth/1920,innerHeight/1080)));const b=document.body;b.style.zoom=s;b.style.width=(innerWidth/s)+'px';b.style.height=(innerHeight/s)+'px'}
addEventListener('resize',fit);fit();
render();
</script>
